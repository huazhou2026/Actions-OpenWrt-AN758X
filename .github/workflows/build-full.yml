name: Build PonWrt Full Featured

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source repo'
        required: true
        default: 'fork'
        type: choice
        options: [fork, pbs05/ponwrt]
      branch:
        description: 'Branch'
        required: true
        default: 'master'
        type: choice
        options: [master, pon]
      upload_release:
        description: 'Upload to Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      fw_author:
        description: 'Firmware author suffix'
        required: false
        default: 'huazhou2026'

permissions:
  contents: write
  actions: write

env:
  BUILD_ROOT: /workdir
  SOURCE: ${{ github.event.inputs.source || 'fork' }}
  FW_AUTHOR: ${{ github.event.inputs.fw_author || 'huazhou2026' }}
  REPO_URL: https://github.com/ztb666ai/ponwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SOC: an7581
  PROFILE: nokia_xg-040g-md-ubi
  TZ: Asia/Shanghai
  UBOOT_REPO: https://github.com/pbs05/uboot-an758x
  UBOOT_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: resolve
        run: echo "week=$(date +%Y%W)" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get -yqq update && sudo apt-get -yqq install build-essential clang llvm dwarves libssl-dev libelf-dev bc flex bison python3 python3-distutils xz-utils tar unzip zip zstd dos2unix ccache gettext rsync file wget curl git subversion 2>/dev/null || true
          sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir

      - name: Clone source
        run: |
          cd $BUILD_ROOT
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf $BUILD_ROOT/openwrt $GITHUB_WORKSPACE/openwrt
          cd openwrt && echo "commit: $(git rev-parse --short HEAD)"

      - name: Patch kernel config (AN7581 soft AES)
        run: |
          cd $BUILD_ROOT/openwrt
          KCONF="target/linux/airoha/an7581/config-6.18"
          for key in CRYPTO_AES CRYPTO_AES_ARM64 CRYPTO_AES_ARM64_BS CRYPTO_AES_ARM64_NEON_BLK CRYPTO_SIMD CRYPTO_CBC CRYPTO_CTR CRYPTO_XTS CRYPTO_GHASH CRYPTO_GCM CRYPTO_HW CRYPTO_DEV_EIP93 CRYPTO_AUTHENC CRYPTO_DEV_EIP93_AES_128_SW_MAX_LEN CRYPTO_DEV_EIP93_GENERIC_SW_MAX_LEN; do
            sed -i -e "/^CONFIG_${key}=/d" -e "/^# CONFIG_${key} is not set$/d" $KCONF
          done
          printf '%s\n' \
            'CONFIG_CRYPTO_AES=y' \
            'CONFIG_CRYPTO_AES_ARM64=y' \
            'CONFIG_CRYPTO_AES_ARM64_BS=y' \
            'CONFIG_CRYPTO_AES_ARM64_NEON_BLK=y' \
            'CONFIG_CRYPTO_SIMD=y' \
            'CONFIG_CRYPTO_CBC=y' \
            'CONFIG_CRYPTO_CTR=y' \
            'CONFIG_CRYPTO_XTS=y' \
            'CONFIG_CRYPTO_GHASH=y' \
            'CONFIG_CRYPTO_GCM=y' \
            'CONFIG_CRYPTO_HW=y' \
            'CONFIG_CRYPTO_DEV_EIP93=m' \
            'CONFIG_CRYPTO_AUTHENC=y' \
            'CONFIG_CRYPTO_DEV_EIP93_AES_128_SW_MAX_LEN=512' \
            'CONFIG_CRYPTO_DEV_EIP93_GENERIC_SW_MAX_LEN=256' \
            >> $KCONF

      - name: Cache dl
        if: ${{ env.USE_DL_CACHE == 'true' }}
        uses: actions/cache@v5
        with:
          path: /workdir/openwrt/dl
          key: ponwrt-dl-${{ env.SOURCE }}-${{ env.REPO_BRANCH }}-${{ steps.resolve.outputs.week }}
          restore-keys: ponwrt-dl-${{ env.SOURCE }}-${{ env.REPO_BRANCH }}-
          save-always: true

      - name: Update feeds
        run: |
          cd $BUILD_ROOT/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull plugins (diy-part1)
        run: |
          cd $BUILD_ROOT/openwrt
          cp $GITHUB_WORKSPACE/diy-part1-usbwifi.sh .
          chmod +x diy-part1-usbwifi.sh
          ./diy-part1-usbwifi.sh

      - name: Load base configs
        run: |
          cd $BUILD_ROOT/openwrt
          [ -f "configs/${SOC}.config" ] && cp "configs/${SOC}.config" .config || : > .config
          cp $GITHUB_WORKSPACE/configs/nokia_xg-040g-md-ubi-full.config configs/nokia_xg-040g-md-ubi.config
          cat configs/nokia_xg-040g-md-ubi.config >> .config
          # Do NOT set device profile here - it will be overwritten by diy-part2/part3
          echo "=== After Load base configs ==="
          grep -E "CONFIG_TARGET_DEVICE_" .config || echo "(none - will be set later)"
          grep -E "CONFIG_TARGET_MULTI_PROFILE" .config || echo "(none - will be set later)"

      - name: Customize (diy-part2)
        env:
          FW_BUILD_TIME: ${{ env.FW_BUILD_TIME }}
          FW_DESC_SUFFIX: ${{ env.FW_DESC_SUFFIX }}
        run: |
          cd $BUILD_ROOT/openwrt
          curl -sL https://raw.githubusercontent.com/ztb666ai/Actions-OpenWrt-AN758X/master/diy-part2.sh -o diy-part2.sh
          chmod +x diy-part2.sh
          FW_AUTHOR=$FW_AUTHOR TZ=$TZ FW_BUILD_TIME="${FW_BUILD_TIME:-$(TZ=$TZ date '+%Y-%m-%d %H:%M')}" FW_DESC_SUFFIX="${FW_DESC_SUFFIX:-· ${FW_AUTHOR} · $(TZ=$TZ date '+%Y-%m-%d %H:%M')}" LAN_HOSTNAME=ponwrt ./diy-part2.sh

      - name: Inject OpenClash
        run: |
          cd $BUILD_ROOT/openwrt
          for pkg in luci-app-openclash luci-compat ca-bundle curl libopenssl ruby ruby-yaml ruby-json ruby-base64; do
            sed -i "/^CONFIG_PACKAGE_${pkg}=/d; /^# CONFIG_PACKAGE_${pkg} is not set/d" .config
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

      - name: Trim translations (diy-part3)
        run: |
          cd $BUILD_ROOT/openwrt
          curl -sL https://raw.githubusercontent.com/ztb666ai/Actions-OpenWrt-AN758X/master/diy-part3.sh -o diy-part3.sh
          chmod +x diy-part3.sh
          KEEP="base luci-app-airoha-npu luci-app-openclash luci-app-ttyd luci-app-onu luci-app-pon-status luci-app-store luci-app-quickstart luci-app-istorex luci-app-autoreboot" ./diy-part3.sh

      - name: Apply device profile (FINAL - after all config changes)
        run: |
          cd $BUILD_ROOT/openwrt
          # Remove any existing device profile entries (from defconfig runs)
          sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config
          # Set our target device profile
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y" >> .config
          echo "CONFIG_TARGET_DEVICE_PACKAGES_airoha_${SOC}_DEVICE_${PROFILE}=\"\" " >> .config
          echo "=== Applied device profile ==="
          grep -E "CONFIG_TARGET_DEVICE_" .config
          grep -E "CONFIG_TARGET_MULTI_PROFILE" .config

      - name: Verify device profile configuration
        run: |
          cd $BUILD_ROOT/openwrt
          echo "=== Verifying device profile ==="
          grep -E "CONFIG_TARGET_DEVICE_.*${PROFILE}" .config || { echo "❌ Profile not found in .config"; exit 1; }
          grep -E "CONFIG_TARGET_MULTI_PROFILE=y" .config || { echo "❌ MULTI_PROFILE not set"; exit 1; }
          echo "✅ Device profile verified: ${PROFILE}"

      - name: Set default hostname to ponwrt (via uci-defaults + base-files patch + config)
        run: |
          cd $BUILD_ROOT/openwrt
          # Method 1: Patch base-files Makefile DEFAULT_HOSTNAME variable (takes precedence at build time)
          # ImmortalWrt base-files uses DEFAULT_HOSTNAME variable, not CONFIG_DEFAULT_HOSTNAME
          if grep -q "DEFAULT_HOSTNAME" package/base-files/Makefile; then
            sed -i 's/DEFAULT_HOSTNAME:=.*/DEFAULT_HOSTNAME:=ponwrt/' package/base-files/Makefile
            echo "✅ Patched DEFAULT_HOSTNAME in base-files/Makefile"
          else
            echo "⚠ DEFAULT_HOSTNAME not found in base-files/Makefile, will use uci-defaults"
          fi
          # Also try CONFIG_DEFAULT_HOSTNAME pattern
          sed -i 's/CONFIG_DEFAULT_HOSTNAME=.*/CONFIG_DEFAULT_HOSTNAME="ponwrt"/' package/base-files/Makefile 2>/dev/null || true
          
          # Method 2: Set in .config directly (highest priority after defconfig)
          sed -i '/^CONFIG_DEFAULT_HOSTNAME=/d; /^# CONFIG_DEFAULT_HOSTNAME is not set/d' .config
          echo 'CONFIG_DEFAULT_HOSTNAME="ponwrt"' >> .config
          echo "✅ Set CONFIG_DEFAULT_HOSTNAME in .config"
          
          # Method 3: uci-defaults script (most reliable - runs at first boot)
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-hostname <<'EOF'
          #!/bin/sh
          uci -q set system.@system[0].hostname='ponwrt'
          uci commit system
          EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-hostname
          echo "=== Hostname set to ponwrt via uci-defaults (runs at first boot) ==="

      - name: Configure NTP servers via uci-defaults
        run: |
          cd $BUILD_ROOT/openwrt
          # Configure NTP client with custom servers via uci defaults
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-ntp-servers <<'EOF'
          #!/bin/sh
          uci -q delete system.ntp
          uci set system.ntp='timeserver'
          uci add_list system.ntp.server='ntp.ntsc.ac.cn'
          uci add_list system.ntp.server='ntp1.aliyun.com'
          uci add_list system.ntp.server='cn.pool.ntp.org'
          uci add_list system.ntp.server='time.cloudflare.com'
          uci set system.ntp.enabled='1'
          uci set system.ntp.enable_server='0'
          uci commit system
          EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-ntp-servers
          echo "=== NTP servers configured via uci-defaults ==="

      - name: Fix iStore menu entries (ensure they appear in Services menu)
        run: |
          cd $BUILD_ROOT/openwrt
          echo "=== Fixing iStore package menu entries ==="
          # luci-app-store: Ensure LUCI_MENU:=Services
          if [ -f "package/custom/luci-app-store/Makefile" ]; then
            echo " 🔧 Fixing luci-app-store menu entry..."
            # Add LUCI_MENU if missing
            if ! grep -q "LUCI_MENU" package/custom/luci-app-store/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_MENU:=Services' package/custom/luci-app-store/Makefile
            else
              sed -i 's/LUCI_MENU:=.*/LUCI_MENU:=Services/' package/custom/luci-app-store/Makefile
            fi
            # Ensure LUCI_TITLE is set
            if ! grep -q "LUCI_TITLE" package/custom/luci-app-store/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_TITLE:=iStore App Store' package/custom/luci-app-store/Makefile
            fi
            echo "✅ luci-app-store menu fixed"
            grep -E "(LUCI_TITLE|LUCI_DEPENDS|LUCI_MENU)" package/custom/luci-app-store/Makefile
          fi
          # luci-app-quickstart: Ensure LUCI_MENU:=Services
          if [ -f "package/custom/luci-app-quickstart/Makefile" ]; then
            echo " 🔧 Fixing luci-app-quickstart menu entry..."
            if ! grep -q "LUCI_MENU" package/custom/luci-app-quickstart/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_MENU:=Services' package/custom/luci-app-quickstart/Makefile
            else
              sed -i 's/LUCI_MENU:=.*/LUCI_MENU:=Services/' package/custom/luci-app-quickstart/Makefile
            fi
            if ! grep -q "LUCI_TITLE" package/custom/luci-app-quickstart/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_TITLE:=iStore QuickStart' package/custom/luci-app-quickstart/Makefile
            fi
            echo "✅ luci-app-quickstart menu fixed"
            grep -E "(LUCI_TITLE|LUCI_DEPENDS|LUCI_MENU)" package/custom/luci-app-quickstart/Makefile
          fi
          # luci-app-istorex: Ensure LUCI_MENU:=Services
          if [ -f "package/custom/luci-app-istorex/Makefile" ]; then
            echo " 🔧 Fixing luci-app-istorex menu entry..."
            if ! grep -q "LUCI_MENU" package/custom/luci-app-istorex/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_MENU:=Services' package/custom/luci-app-istorex/Makefile
            else
              sed -i 's/LUCI_MENU:=.*/LUCI_MENU:=Services/' package/custom/luci-app-istorex/Makefile
            fi
            if ! grep -q "LUCI_TITLE" package/custom/luci-app-istorex/Makefile; then
              sed -i '/LUCI_DEPENDS:=.*/a LUCI_TITLE:=iStoreX Dashboard' package/custom/luci-app-istorex/Makefile
            fi
            echo "✅ luci-app-istorex menu fixed"
            grep -E "(LUCI_TITLE|LUCI_DEPENDS|LUCI_MENU)" package/custom/luci-app-istorex/Makefile
          fi

      - name: Expand config (make defconfig) to resolve dependencies
        run: |
          cd $BUILD_ROOT/openwrt
          make defconfig
          echo "=== Config expanded via make defconfig ==="
          grep -E "CONFIG_DEFAULT_HOSTNAME" .config || echo "Hostname not in .config"
          grep -E "CONFIG_PACKAGE_luci-app-store" .config || echo "luci-app-store not in .config"
          grep -E "CONFIG_PACKAGE_luci-app-quickstart" .config || echo "luci-app-quickstart not in .config"
          grep -E "CONFIG_PACKAGE_luci-app-onu" .config || echo "luci-app-onu not in .config"
          grep -E "CONFIG_PACKAGE_luci-app-autoreboot" .config || echo "luci-app-autoreboot not in .config"
          # Verify iStore package structure
          echo "=== Verifying iStore package structure ==="
          [ -d "package/custom/luci-app-store" ] && echo "✅ luci-app-store dir exists" || echo "❌ luci-app-store dir missing"
          [ -d "package/custom/luci-app-quickstart" ] && echo "✅ luci-app-quickstart dir exists" || echo "❌ luci-app-quickstart dir missing"
          [ -d "package/custom/luci-app-istorex" ] && echo "✅ luci-app-istorex dir exists" || echo "❌ luci-app-istorex dir missing"
          [ -d "package/custom/luci-lib-taskd" ] && echo "✅ luci-lib-taskd dir exists" || echo "❌ luci-lib-taskd dir missing"
          [ -d "package/custom/luci-lib-xterm" ] && echo "✅ luci-lib-xterm dir exists" || echo "❌ luci-lib-xterm dir missing"
          [ -d "package/custom/taskd" ] && echo "✅ taskd dir exists" || echo "❌ taskd dir missing"
          [ -f "package/custom/luci-app-store/Makefile" ] && echo "✅ luci-app-store Makefile exists" || echo "❌ luci-app-store Makefile missing"
          [ -f "package/custom/luci-app-quickstart/Makefile" ] && echo "✅ luci-app-quickstart Makefile exists" || echo "❌ luci-app-quickstart Makefile missing"
          [ -f "package/custom/luci-app-istorex/Makefile" ] && echo "✅ luci-app-istorex Makefile exists" || echo "❌ luci-app-istorex Makefile missing"
          [ -f "package/custom/luci-lib-taskd/Makefile" ] && echo "✅ luci-lib-taskd Makefile exists" || echo "❌ luci-lib-taskd Makefile missing"
          [ -f "package/custom/luci-lib-xterm/Makefile" ] && echo "✅ luci-lib-xterm Makefile exists" || echo "❌ luci-lib-xterm Makefile missing"
          [ -f "package/custom/taskd/Makefile" ] && echo "✅ taskd Makefile exists" || echo "❌ taskd Makefile missing"
          # Check iStore Makefile for menu entry
          if [ -f "package/custom/luci-app-store/Makefile" ]; then
            echo "--- luci-app-store Makefile content ---"
            cat package/custom/luci-app-store/Makefile
          fi
          if [ -f "package/custom/luci-app-quickstart/Makefile" ]; then
            echo "--- luci-app-quickstart Makefile content ---"
            cat package/custom/luci-app-quickstart/Makefile
          fi
          if [ -f "package/custom/luci-app-istorex/Makefile" ]; then
            echo "--- luci-app-istorex Makefile content ---"
            cat package/custom/luci-app-istorex/Makefile
          fi
          if [ -f "package/custom/quickstart/Makefile" ]; then
            echo "--- quickstart Makefile content ---"
            cat package/custom/quickstart/Makefile
          fi
          if [ -f "package/custom/luci-lib-taskd/Makefile" ]; then
            echo "--- luci-lib-taskd Makefile content ---"
            cat package/custom/luci-lib-taskd/Makefile
          fi
          # Force-enable iStore packages in .config if they were dropped by defconfig
          echo "=== Force-enabling critical packages ==="
          for pkg in luci-app-store luci-app-quickstart luci-app-istorex luci-lib-taskd luci-lib-xterm taskd luci-app-onu luci-app-pon-status luci-app-autoreboot luci-app-airoha-npu luci-app-ttyd luci-app-openclash luci-compat; do
            sed -i "/^CONFIG_PACKAGE_${pkg}=/d; /^# CONFIG_PACKAGE_${pkg} is not set/d" .config
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          # Force-enable additional USB WiFi drivers
          for pkg in kmod-rtl8723bu kmod-rtl8192eu; do
            sed -i "/^CONFIG_PACKAGE_${pkg}=/d; /^# CONFIG_PACKAGE_${pkg} is not set/d" .config
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          echo "✅ Critical packages force-enabled in .config"

      - name: Install aarch64 cross-compilation toolchain (for U-Boot)
        run: |
          sudo apt-get -yqq update && sudo apt-get -yqq install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu 2>/dev/null || true
          which aarch64-linux-gnu-gcc && echo "✅ aarch64-linux-gnu-gcc installed"

      - name: Fetch and integrate U-Boot (an7581 for Nokia XG-040G-MD)
        run: |
          cd $BUILD_ROOT
          # Clone U-Boot for AN7581
          git clone $UBOOT_REPO -b $UBOOT_BRANCH --single-branch --depth=1 uboot-an758x
          cd uboot-an758x
          echo "U-Boot commit: $(git rev-parse --short HEAD)"
          
          # Build U-Boot for an7581 (nokia_xg-040g-md)
          # Correct defconfig from U-Boot repo: an7581_nokia_xg-040g-md_defconfig
          make an7581_nokia_xg-040g-md_defconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee uboot_build.log
          
          # Copy U-Boot binary to openwrt for FIT image generation
          if [ -f u-boot.bin ]; then
            mkdir -p $BUILD_ROOT/openwrt/target/linux/airoha/an7581/base-files/
            cp u-boot.bin $BUILD_ROOT/openwrt/target/linux/airoha/an7581/base-files/u-boot-an7581-nokia_xg-040g-md-ubi.bin
            echo "✅ U-Boot binary copied for FIT image generation"
          else
            echo "❌ U-Boot build failed - u-boot.bin not found"
            exit 1
          fi

      - name: Download
        run: |
          cd $BUILD_ROOT/openwrt
          make download -j$(nproc) || true

      - name: Build
        run: |
          cd $BUILD_ROOT/openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Verify build produced correct profile
        run: |
          cd $BUILD_ROOT/openwrt
          echo "=== All generated images ==="
          find bin/targets -type f \( -name "*.itb" -o -name "*.ubi" -o -name "*.img" \) | xargs -I{} ls -la {}
          echo ""
          echo "=== Checking for nokia_xg-040g-md-ubi profile ==="
          # Try multiple naming patterns
          if find bin/targets -type f \( -name "*nokia_xg-040g-md-ubi*" -o -name "*an7581*nokia_xg-040g-md*" -o -name "*nokia*xg*040g*md*" \) | grep -q .; then
            echo "✅ nokia_xg-040g-md-ubi firmware found"
            find bin/targets -type f \( -name "*nokia_xg-040g-md-ubi*" -o -name "*an7581*nokia_xg-040g-md*" -o -name "*nokia*xg*040g*md*" \) | xargs -I{} ls -la {}
          else
            echo "❌ nokia_xg-040g-md-ubi firmware NOT found!"
            echo "Build log tail:"
            tail -100 build.log
            exit 1
          fi

      - name: Verify FIT image contains rootfs
        run: |
          cd $BUILD_ROOT/openwrt
          for f in bin/targets/**/*nokia_xg-040g-md-ubi*.itb bin/targets/**/*an7581*nokia_xg-040g-md*.itb; do
            if [ -f "$f" ]; then
              echo "=== Checking $f ==="
              dumpimage -l "$f" 2>/dev/null || echo "dumpimage not available"
            fi
          done

      - name: Collect artifacts (nokia_xg-040g-md-ubi only)
        if: success()
        run: |
          cd $BUILD_ROOT/openwrt
          mkdir -p $BUILD_ROOT/artifacts
          # Use broader patterns to catch all possible naming variations
          find bin/targets -type f \( -name "*nokia_xg-040g-md-ubi*.itb" -o -name "*nokia_xg-040g-md-ubi*.ubi" -o -name "*nokia_xg-040g-md-ubi*.img" -o -name "*an7581*nokia_xg-040g-md*.itb" -o -name "*an7581*nokia_xg-040g-md*.ubi" -o -name "*an7581*nokia_xg-040g-md*.img" \) | xargs -I{} cp {} $BUILD_ROOT/artifacts/
          find bin/targets -type f -name "*squashfs-sysupgrade.itb" | xargs -I{} cp {} $BUILD_ROOT/artifacts/ 2>/dev/null || true
          echo "=== Collected artifacts ==="
          ls -la $BUILD_ROOT/artifacts/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-nokia_xg-040g-md-ubi-full
          path: /workdir/artifacts/**
          retention-days: 30

      - name: Create Release
        if: success() && github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SOC }}-${{ env.PROFILE }}-full-${{ github.run_number }}
          name: PonWrt ${{ env.SOC }} ${{ env.PROFILE }} Full Featured #${{ github.run_number }}
          files: /workdir/artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}